<!DOCTYPE html>

<body>
    <main class="shell">

        </header>

        <nav class="grid" aria-label="Accesos directos">

                        <path d="M21.42 10.92a1 1 0 0 0-.02-1.84L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0z"/>
                        <path d="M22 10v6"/>
                        <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
                    </svg>
                </span>
                <span class="tile__text">
                    <span class="tile__title">Moodle</span>

            <a class="tile tile--github" href="https://github.com" target="_blank" rel="noopener noreferrer">

                    <svg viewBox="0 0 24 24" fill="currentColor">

                    </svg>
                </span>
                <span class="tile__text">
                    <span class="tile__title">GitHub</span>
                    <span class="tile__sub">Repos y código</span>
                </span>
                <kbd class="tile__key">2</kbd>
                <span class="tile__go" aria-hidden="true">↗</span>
            </a>

            <a class="tile tile--drive" href="https://drive.google.com" target="_blank" rel="noopener noreferrer">
                <span class="tile__icon" aria-hidden="true">
                    <svg viewBox="0 0 87.3 78">
                        <path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
                        <path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0 -1.2 4.5h27.5z" fill="#00ac47"/>
                        <path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/>
                        <path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/>

                        <path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>

                    <span class="tile__title">Drive</span>

                        <path d="M8 2v4"/>
                        <path d="M16 2v4"/>
                        <rect width="18" height="18" x="3" y="4" rx="2"/>
                        <path d="M3 10h18"/>
                        <path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/>
                        <path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>
                    </svg>
                </span>
                <span class="tile__text">
                    <span class="tile__title">Horario</span>
                    <span class="tile__sub">Clases de la semana</span>
                </span>
                <kbd class="tile__key">4</kbd>
                <span class="tile__go" aria-hidden="true">↗</span>
            </a>

            <a class="tile tile--mecanografo" href="mecanografo/mecanografo.html">
                <span class="tile__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="16" x="2" y="4" rx="2"/>
                        <path d="M6 8h.01"/><path d="M10 8h.01"/><path d="M14 8h.01"/><path d="M18 8h.01"/>
                        <path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/>
                        <path d="M7 16h10"/>
                    </svg>
                </span>
                <span class="tile__text">
                    <span class="tile__title">Mecanógrafo <span class="tile__badge">Nuevo</span></span>
                    <span class="tile__sub">Mide tus palabras por minuto</span>
                </span>
                <kbd class="tile__key">5</kbd>
                <span class="tile__go" aria-hidden="true">→</span>
            </a>
        </nav>

        <footer class="foot">
            <a class="foot__back" href="index.html">← Inicio</a>
            <span class="foot__hint">Pulsa <kbd>1</kbd>–<kbd>5</kbd> para abrir un acceso</span>
        </footer>
    </main>

<script>
    const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
    const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
                   'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

    const dos = n => n.toString().padStart(2, '0');

    function saludo(hora) {
        if (hora >= 6 && hora < 14) return 'Buenos días';
        if (hora >= 14 && hora < 21) return 'Buenas tardes';
        return 'Buenas noches';
    }

    // Reloj, fecha y saludo de la cabecera
    function actualizarCabecera() {
        const ahora = new Date();
        const fecha = `${DIAS[ahora.getDay()]}, ${ahora.getDate()} de ${MESES[ahora.getMonth()]}`;
        document.getElementById('reloj').textContent = `${dos(ahora.getHours())}:${dos(ahora.getMinutes())}`;
        document.getElementById('fecha').textContent = fecha.charAt(0).toUpperCase() + fecha.slice(1);
        document.getElementById('saludo').textContent = `${saludo(ahora.getHours())}, Chema`;
    }

    // El título de la pestaña alterna entre la hora y la fecha cada 10 segundos
    let mostrarFecha = false;
    function actualizarTitulo() {
        const ahora = new Date();
        document.title = mostrarFecha
            ? `${dos(ahora.getDate())}/${dos(ahora.getMonth() + 1)}/${ahora.getFullYear()}`
            : `${dos(ahora.getHours())}:${dos(ahora.getMinutes())}`;
        mostrarFecha = !mostrarFecha;
    }

    actualizarCabecera();
    actualizarTitulo();
    setInterval(actualizarCabecera, 1000);
    setInterval(actualizarTitulo, 10000);

    // Atajos de teclado: 1-5 abren el acceso correspondiente
    const accesos = document.querySelectorAll('.tile');
    document.addEventListener('keydown', e => {
        if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
        const n = parseInt(e.key, 10);
        if (n >= 1 && n <= accesos.length) accesos[n - 1].click();
    });
</script>
</body>
</html>
